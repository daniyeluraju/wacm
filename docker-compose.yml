version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: wacm
      DB_USERNAME: wacm_user
      DB_PASSWORD: wacm_secret_password
      GATEWAY_URL: "http://127.0.0.1:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
      - gateway_auth:/var/www/html/gateway/auth_info_baileys

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: wacm
      MYSQL_USER: wacm_user
      MYSQL_PASSWORD: wacm_secret_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wacm_user", "-pwacm_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  app_storage:
  gateway_auth:
